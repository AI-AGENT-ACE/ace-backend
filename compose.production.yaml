name: ace

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be a commit SHA image}
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      UPLOAD_DIR: /data/ace/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    volumes:
      - ace_uploads:/data/ace/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  backend-migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be a commit SHA image}
    profiles: [migration]
    env_file: .env
    environment:
      NODE_ENV: production
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  ai:
    image: ${AI_IMAGE:-ghcr.io/ai-agent-ace/ace-ai:latest}
    profiles: [ai]
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ace_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ace_uploads:
  ace_postgres:
  ace_redis:
