services:
  backend:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      UPLOAD_DIR: /data/ace/uploads
    ports:
      - "3001:3001"
    volumes:
      - ace_uploads:/data/ace/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  ace_uploads:
