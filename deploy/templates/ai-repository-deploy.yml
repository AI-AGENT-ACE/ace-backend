# Copy this file to the ace-ai repository as .github/workflows/deploy.yml.
name: AI Image and Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ace-ai-production
  cancel-in-progress: false

jobs:
  image-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      AWS_HOST: ${{ secrets.AWS_HOST }}
      AWS_USER: ${{ secrets.AWS_USER }}
      AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
      AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/ace_deploy
          chmod 600 ~/.ssh/ace_deploy
          printf '%s\n' "$AWS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy only AI service
        shell: bash
        run: |
          printf -v remote_command 'set -eu; cd %q; export AI_IMAGE=%q; docker compose -f compose.production.yaml --profile ai pull ai; docker compose -f compose.production.yaml --profile ai up -d --no-deps ai' "$DEPLOY_PATH" '${{ steps.image.outputs.image }}'
          ssh -i ~/.ssh/ace_deploy "$AWS_USER@$AWS_HOST" "$remote_command"
